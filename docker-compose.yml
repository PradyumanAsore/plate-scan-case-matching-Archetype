version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platescan
      POSTGRES_PASSWORD: changeme_in_production
      POSTGRES_DB: platescan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platescan"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://platescan:changeme_in_production@db:5432/platescan
      JWT_SECRET_KEY: dev_secret_change_in_production_abc123
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 480
      BACKEND_CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      ELIGIBILITY_SERVICE_URL: http://backend:8000/mock/partner-network/eligibility
      ELIGIBILITY_TIMEOUT_SECONDS: 5
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
